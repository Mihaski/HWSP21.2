[project]
name = "hwsp21-2"
version = "0.1.0"
description = ""
authors = [
    { name = "Mikey Zabrodin", email = "mzabrodin94@gmail.com" }
]
requires-python = "^3.14"
dependencies = [

]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
lint = [
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.4.1,<8.0.0)",
    "isort (>=8.0.1,<9.0.1)",
    "mypy (>=2.1.0,<3.0.0)"
]
[tool.mypy]
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'
warn_unreachable = true
[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''(/(  \.eggs
                    | \.git
                    | \.hg
                    | \.mypy_cache
                    | \.tox
                    | \.venv
                    | dist  )/)'''
[tool.isort]
# максимальная длина строки
line_length = 119